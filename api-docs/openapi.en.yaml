openapi: 3.0.3
info:
  title: Storefront Catalog API
  description: API for creating and updating catalog products. All responses follow the envelope { successful, error_code, data }.
  version: 1.0.0
servers:
  - url: /
  - url: http://localhost:8080
tags:
  - name: Product
paths:
  /product:
    post:
      tags: [Product]
      operationId: createProduct
      summary: Create product
      description: name and price are required. price and sale_price must be >= 0 when provided. sale_price cannot exceed price. description and sale_price are optional. On success, data.data1 is the product id and data.data2 is the product name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
            examples:
              Success:
                value:
                  name: Oolong milk tea
                  description: Large cup, less ice
                  sale_price: 55
                  price: 65
              Name required:
                value:
                  price: 129
              Price required:
                value:
                  name: Ceramic mug
              Negative price:
                value:
                  name: Thai iced coffee
                  price: -5
              Negative sale price:
                value:
                  name: Mango sticky rice
                  price: 85
                  sale_price: -10
              Sale price exceeds price:
                value:
                  name: Winter jacket
                  price: 1200
                  sale_price: 1499
      responses:
        "200":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProductSuccessResponse"
              examples:
                Success:
                  value:
                    successful: true
                    error_code: ""
                    data:
                      data1: "7c4e9b12-3a6f-4d1e-9c82-1f5a8d3e6b07"
                      data2: Oolong milk tea
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Name required:
                  value:
                    successful: false
                    error_code: name is required
                    data: null
                Price required:
                  value:
                    successful: false
                    error_code: price is required
                    data: null
                Price must be greater than or equal to 0:
                  value:
                    successful: false
                    error_code: price must be greater than or equal to 0
                    data: null
                Sale price must be greater than or equal to 0:
                  value:
                    successful: false
                    error_code: sale_price must be greater than or equal to 0
                    data: null
                Sale price must not exceed price:
                  value:
                    successful: false
                    error_code: sale_price must not exceed price
                    data: null
                Invalid json body:
                  value:
                    successful: false
                    error_code: invalid json body
                    data: null
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Internal server error:
                  value:
                    successful: false
                    error_code: internal server error
                    data: null
  /product/{id}:
    patch:
      tags: [Product]
      operationId: updateProduct
      summary: Update a product
      description: Omitted fields are left unchanged. Sending null for description or sale_price clears that field. name and price cannot be null. price and sale_price must be >= 0 when provided. sale_price cannot exceed price when both are sent in the same request. The body must include at least one field. On success, data is null.
      parameters:
        - name: id
          in: path
          required: true
          description: product id (UUID)
          schema:
            type: string
            format: uuid
          example: "a83f2c10-9e4b-4c7a-b6d1-2f8e5a0193c4"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
            examples:
              Success:
                value:
                  sale_price: 299
              At least one field is required:
                value: {}
              Name cannot be null:
                value:
                  name: null
              Price cannot be null:
                value:
                  price: null
              Negative price:
                value:
                  price: -12.5
              Negative sale price:
                value:
                  sale_price: -3
              Sale price exceeds price:
                value:
                  price: 450
                  sale_price: 520
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateProductSuccessResponse"
              examples:
                Success:
                  value:
                    successful: true
                    error_code: ""
                    data: null
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                At least one field is required:
                  value:
                    successful: false
                    error_code: at least one field is required
                    data: null
                Invalid product id:
                  value:
                    successful: false
                    error_code: invalid product id
                    data: null
                Name cannot be null:
                  value:
                    successful: false
                    error_code: name cannot be null
                    data: null
                Price cannot be null:
                  value:
                    successful: false
                    error_code: price cannot be null
                    data: null
                Price must be greater than or equal to 0:
                  value:
                    successful: false
                    error_code: price must be greater than or equal to 0
                    data: null
                Sale price must be greater than or equal to 0:
                  value:
                    successful: false
                    error_code: sale_price must be greater than or equal to 0
                    data: null
                Sale price must not exceed price:
                  value:
                    successful: false
                    error_code: sale_price must not exceed price
                    data: null
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Product not found:
                  value:
                    successful: false
                    error_code: product not found
                    data: null
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Internal server error:
                  value:
                    successful: false
                    error_code: internal server error
                    data: null
components:
  schemas:
    EnvelopeFields:
      type: object
      required: [successful, error_code, data]
      properties:
        successful:
          type: boolean
          description: true when the request succeeded
        error_code:
          type: string
          description: empty on success, otherwise an English error message
        data:
          nullable: true
          description: payload on success, null on failure
    CreateProductRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          description: product name
        description:
          type: string
          nullable: true
          description: optional product description
        sale_price:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: optional sale price; must be >= 0 and must not exceed price
        price:
          type: number
          format: double
          minimum: 0
          description: required product price; must be >= 0
    CreateProductData:
      type: object
      required: [data1, data2]
      properties:
        data1:
          type: string
          description: product id
        data2:
          type: string
          description: product name
    CreateProductSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeFields"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CreateProductData"
    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          description: new name; omit to keep the current value; null is not allowed
        description:
          type: string
          nullable: true
          description: new description; omit to keep; null clears it
        sale_price:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: new sale price; omit to keep; null clears it; must be >= 0; must not exceed price when sent together with price
        price:
          type: number
          format: double
          minimum: 0
          description: new price; omit to keep; null is not allowed; must be >= 0
    UpdateProductSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeFields"
        - type: object
          properties:
            data:
              nullable: true
              description: payload on success, null on failure
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeFields"
        - type: object
          properties:
            data:
              nullable: true
              description: payload on success, null on failure
